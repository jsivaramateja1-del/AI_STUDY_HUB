<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Hub — Forgot Password</title>
  <!-- FIX: Removed wrong fonts (Space Grotesk/JetBrains). style.css imports Orbitron + Exo 2 -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page otp-page">
  <div class="cursor-dot"  id="cursorDot"  aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <!-- FIX: Replaced starfield/nebula/grid-overlay (don't exist in style.css) with nc-bg -->
  <div class="nc-bg" aria-hidden="true">
    <div class="nc-grid"></div>
    <div class="nc-blob nc-blob-1"></div>
    <div class="nc-blob nc-blob-2"></div>
    <div class="nc-scan"></div>
    <div class="nc-particles"></div>
  </div>

  <div class="otp-card">

    <div class="otp-icon-wrap">
      <span class="otp-icon-inner">🔑</span>
      <div class="otp-icon-ring"></div>
    </div>

    <h1 class="otp-heading">
      Forgot
      <span class="otp-neon">Password?</span>
    </h1>

    <p class="otp-sub">No worries! Enter your registered email and we'll send you an OTP to reset your password.</p>

    {% if error %}
    <div class="otp-alert otp-alert--error" role="alert">
      <span>⚠</span> {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div class="otp-alert otp-alert--success" role="alert">
      <span>✓</span> {{ success }}
    </div>
    {% endif %}

    <form action="/forgot-password" method="POST" id="forgotForm" novalidate>

      <div class="field">
        <label for="fpEmail" class="field-label">// your email</label>
        <div class="field-wrap">
          <svg class="field-ico" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
            <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
          </svg>
          <input type="email" id="fpEmail" name="email" class="field-input"
                 placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="forgotBtn">
        <span class="btn-label">Send OTP</span>
        <span class="btn-arrow">→</span>
        <span class="btn-loader" aria-hidden="true"></span>
      </button>

    </form>

    <div class="otp-footer-actions">
      <a href="/" class="otp-back-link">← Back to login</a>
    </div>

  </div>

  <script src="/static/script.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', function() {
      var btn    = document.getElementById('forgotBtn');
      var loader = btn.querySelector('.btn-loader');
      var label  = btn.querySelector('.btn-label');
      var arrow  = btn.querySelector('.btn-arrow');
      if (loader) loader.classList.add('active');
      if (label)  label.textContent = 'Sending…';
      if (arrow)  arrow.textContent = '';
      btn.disabled = true;
    });
  </script>
</body>
</html>
