<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Study Hub — Reset Password</title>
  <!-- FIX: Removed wrong fonts (Space Grotesk/JetBrains). style.css imports Orbitron + Exo 2 -->
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-page otp-page">
  <div class="cursor-dot"  id="cursorDot"  aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <!-- FIX: Replaced starfield/nebula/neb-green/grid-overlay (don't exist) with nc-bg -->
  <div class="nc-bg" aria-hidden="true">
    <div class="nc-grid"></div>
    <div class="nc-blob nc-blob-2"></div>
    <div class="nc-blob nc-blob-3"></div>
    <div class="nc-scan"></div>
    <div class="nc-particles"></div>
  </div>

  <div class="otp-card">

    <div class="otp-icon-wrap">
      <span class="otp-icon-inner">🛡️</span>
      <div class="otp-icon-ring"></div>
    </div>

    <h1 class="otp-heading">
      New
      <span class="neon-green">Password</span>
    </h1>

    <p class="otp-sub">
      Creating new password for<br>
      <span class="otp-email-tag">{{ email }}</span>
    </p>

    {% if error %}
    <div class="otp-alert otp-alert--error" role="alert">
      <span>⚠</span> {{ error }}
    </div>
    {% endif %}

    <form action="/reset-password" method="POST" id="resetForm" novalidate>

      <div class="field">
        <label for="newPw" class="field-label">// new password</label>
        <div class="field-wrap">
          <svg class="field-ico" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
          </svg>
          <input type="password" id="newPw" name="password" class="field-input"
                 placeholder="Min 6 characters" minlength="6" required autocomplete="new-password">
        </div>
      </div>

      <div class="field">
        <label for="confirmPw" class="field-label">// confirm password</label>
        <div class="field-wrap">
          <svg class="field-ico" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
          </svg>
          <input type="password" id="confirmPw" name="confirm" class="field-input"
                 placeholder="Repeat your password" required autocomplete="new-password">
        </div>
      </div>

      <!-- Password strength bar -->
      <div class="strength-wrap">
        <div class="strength-bar">
          <div class="strength-fill" id="strengthFill"></div>
        </div>
        <span class="strength-label" id="strengthLabel"></span>
      </div>

      <button type="submit" class="btn-submit btn-submit--green" id="resetBtn">
        <span class="btn-label">Reset Password</span>
        <span class="btn-arrow">→</span>
        <span class="btn-loader" aria-hidden="true"></span>
      </button>

    </form>

  </div>

  <script src="/static/script.js"></script>
  <script>
    // Password strength checker
    var pwInput = document.getElementById('newPw');
    var fill    = document.getElementById('strengthFill');
    var label   = document.getElementById('strengthLabel');

    pwInput.addEventListener('input', function() {
      var val = pwInput.value;
      var score = 0;
      if (val.length >= 6)            score++;
      if (val.length >= 10)           score++;
      if (/[A-Z]/.test(val))          score++;
      if (/[0-9]/.test(val))          score++;
      if (/[^A-Za-z0-9]/.test(val))   score++;

      var levels = [
        { pct: '0%',   cls: '',           txt: '' },
        { pct: '25%',  cls: 'str-weak',   txt: 'Weak' },
        { pct: '50%',  cls: 'str-fair',   txt: 'Fair' },
        { pct: '75%',  cls: 'str-good',   txt: 'Good' },
        { pct: '90%',  cls: 'str-strong', txt: 'Strong' },
        { pct: '100%', cls: 'str-great',  txt: 'Very Strong' },
      ];
      var lv = levels[Math.min(score, 5)];
      fill.style.width  = lv.pct;
      fill.className    = 'strength-fill ' + lv.cls;
      label.textContent = lv.txt;
    });

    // Submit loader
    document.getElementById('resetForm').addEventListener('submit', function() {
      var btn    = document.getElementById('resetBtn');
      var loader = btn.querySelector('.btn-loader');
      var lbl    = btn.querySelector('.btn-label');
      var arrow  = btn.querySelector('.btn-arrow');
      if (loader) loader.classList.add('active');
      if (lbl)    lbl.textContent = 'Resetting…';
      if (arrow)  arrow.textContent = '';
      btn.disabled = true;
    });
  </script>
</body>
</html>
